<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solara API 连通性诊断</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:16px}button{padding:12px}pre{white-space:pre-wrap;word-break:break-word;background:#f4f4f4;padding:16px;border-radius:8px}</style><h2>Solara API 连通性诊断</h2><p>此页面只执行搜索及播放地址解析，不会下载或播放音频。它分别测试浏览器直连 GDStudio 和 Cloudflare 代理。</p><button id="run">开始诊断</button><pre id="out">等待开始</pre><script>document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#out');out.textContent='测试中…';const params='types=search&source=netease&name=hello&count=2&pages=1';const targets=[['浏览器直连搜索','https://music-api.gdstudio.xyz/api.php?'+params],['Cloudflare 代理搜索','/proxy?'+params+'&nocache=true']];const log=[];let song=null;for(const [name,url] of targets){try{const response=await fetch(url,{cache:'no-store'});const raw=await response.text();log.push(name+': HTTP '+response.status+'; CORS='+response.headers.get('access-control-allow-origin')+'; '+raw.slice(0,350));if(name==='浏览器直连搜索'&&response.ok){const data=JSON.parse(raw);if(Array.isArray(data)&&data.length)song=data[0]}}catch(e){log.push(name+': '+String(e))}}if(song){const p=new URLSearchParams({types:'url',source:song.source||'netease',id:String(song.id),br:'320'});try{const r=await fetch('https://music-api.gdstudio.xyz/api.php?'+p,{cache:'no-store'});const t=await r.text();log.push('浏览器直连播放地址解析: HTTP '+r.status+'; '+t.slice(0,350))}catch(e){log.push('浏览器直连播放地址解析: '+String(e))}}out.textContent=log.join('\n\n')};</script></html>
