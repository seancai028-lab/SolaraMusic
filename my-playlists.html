<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solara · 我的歌单</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#11131b;color:#f6f6fa;font:15px system-ui,sans-serif}main{max-width:780px;margin:auto;padding:24px 16px 80px}a{color:#a9baff}h1{font-size:27px}h2{font-size:20px}button,input{font:inherit}button{background:#30354a;color:#fff;border:0;border-radius:10px;padding:10px 13px;cursor:pointer}button.primary{background:#536fe4}button.danger{color:#ffaaaa}input{background:#24283a;color:white;border:1px solid #4b536b;border-radius:10px;padding:12px;width:100%;margin:8px 0}.row{display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:1px solid #35394a;padding:12px 0}.row span{flex:1;overflow-wrap:anywhere}.actions,.toolbar{display:flex;flex-wrap:wrap;gap:7px}.toolbar{margin:16px 0}.hidden{display:none!important}#status{white-space:pre-wrap;color:#b6c5ff;margin:15px 0}.muted{color:#aab0c1;font-size:13px}
</style></head><body><main>
<a href="/">← 返回播放器</a><h1>我的歌单</h1>

<section id="manager"><div class="toolbar"><button class="primary" id="create">＋ 新建歌单</button><button id="refresh">刷新</button></div><div id="list"></div><section id="detail" class="hidden"><h2 id="title"></h2><p id="count" class="muted"></p><div class="toolbar"><button id="play" class="primary">▶ 切换到此歌单</button><button id="import">导入 JSON</button><button id="export">导出 JSON</button><button id="back">返回歌单列表</button></div><input class="hidden" type="file" id="file" accept=".json,application/json"><div id="songs"></div></section></section><div id="status" role="status"></div>
</main><script type="module">
let active=null,songs=[];
const $=id=>document.getElementById(id),show=(id,on)=>$(id).classList.toggle("hidden",!on),status=s=>$("status").textContent=s;
const element=(tag,text)=>{const e=document.createElement(tag);e.textContent=String(text??"");return e};
const button=(label,fn,cls="")=>{const b=element("button",label);b.className=cls;b.onclick=()=>perform(fn);return b};
async function perform(fn){try{status("");await fn()}catch(e){status("操作失败："+e.message)}}
async function api(path="",method="GET",payload){const r=await fetch("/api/playlists"+path,{method,headers:{"Content-Type":"application/json"},body:payload===undefined?undefined:JSON.stringify(payload),credentials:"same-origin"});const d=await r.json();if(!r.ok){if(r.status===401){location.href="/login";throw Error("请先登录 Solara")}throw Error(d.error||"服务器请求失败")}return d}
async function loadLists(){const data=await api();$("list").replaceChildren();show("list",true);show("detail",false);for(const p of data){const row=element("div");row.className="row";const actions=element("div");actions.className="actions";actions.append(button("打开",()=>openList(p)),button("改名",async()=>{const name=prompt("歌单名称",p.name);if(!name?.trim())return;await api("/"+encodeURIComponent(p.id),"PATCH",{name:name.trim()});await loadLists()}),button("删除",async()=>{if(!confirm("确定删除「"+p.name+"」及其中歌曲？"))return;await api("/"+encodeURIComponent(p.id),"DELETE");await loadLists()},"danger"));row.append(element("span",p.name),actions);$("list").append(row)}if(!data.length)$("list").append(element("p","暂无歌单，点击「新建歌单」开始。"))}
async function openList(p){active=p;show("list",false);show("detail",true);$("title").textContent=p.name;await loadSongs()}
async function loadSongs(){songs=await api("/"+encodeURIComponent(active.id)+"/songs");$("count").textContent=songs.length+" 首歌曲";$("songs").replaceChildren();for(const s of songs){const row=element("div");row.className="row";const artist=Array.isArray(s.artist)?s.artist.join("、"):(s.artist||"");const del=button("移除",async()=>{if(!confirm("移除这首歌曲？"))return;await api("/"+encodeURIComponent(active.id)+"/songs/"+encodeURIComponent(s.source||"netease")+"/"+encodeURIComponent(String(s.id??s.url_id)),"DELETE");await loadSongs()},"danger");row.append(element("span",(s.name||"未知歌曲")+" — "+artist),del);$("songs").append(row)}}
$("create").onclick=()=>perform(async()=>{const name=prompt("新歌单名称");if(!name?.trim())return;await api("","POST",{name:name.trim()});await loadLists()});
$("refresh").onclick=()=>perform(loadLists);$("back").onclick=()=>perform(loadLists);
$("import").onclick=()=>$("file").click();
$("file").onchange=()=>perform(async()=>{const f=$("file").files[0];if(!f)return;const d=JSON.parse(await f.text());const items=Array.isArray(d)?d:Array.isArray(d.songs)?d.songs:Array.isArray(d.items)?d.items:Array.isArray(d.playlistSongs)?d.playlistSongs:null;if(!items)throw Error("JSON 中未找到歌曲数组");for(let i=0;i<items.length;i+=50){await api("/"+encodeURIComponent(active.id)+"/songs","POST",{songs:items.slice(i,i+50)});status("导入进度："+Math.min(i+50,items.length)+"/"+items.length)}$("file").value="";await loadSongs();status("导入完成")});
$("play").onclick=()=>perform(async()=>{if(!songs.length)throw Error("歌单没有歌曲");sessionStorage.setItem("solara_pending_playlist",JSON.stringify({id:active.id,name:active.name,songs}));location.href="/"});
$("export").onclick=()=>{const blob=new Blob([JSON.stringify(songs,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=(active?.name||"playlist")+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
perform(loadLists);
</script></body></html>
